<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>커뮤니티 | SportPick</title>
  <meta name="description" content="SportPick 이용자들이 자유롭게 소통하는 커뮤니티 게시판이에요." />
  <link rel="canonical" href="https://www.sportpick.net/community.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="index.html"><span class="logo-emoji">⚽</span>Sport<span class="accent">Pick</span></a>
      <nav>
        <a href="index.html">홈</a>
        <a class="active" href="community.html">커뮤니티</a>
        <a href="privacy.html">개인정보처리방침</a>
      </nav>
    </div>
    <div class="auth-area" id="auth-area">
      <button type="button" class="btn-ghost" id="btn-login">로그인</button>
      <button type="button" class="btn-accent" id="btn-signup">회원가입</button>
    </div>
  </header>

  <div class="modal-overlay" id="auth-modal" hidden>
    <div class="modal">
      <button type="button" class="modal-close" id="modal-close" aria-label="닫기">&times;</button>
      <div class="modal-tabs">
        <button type="button" class="modal-tab active" data-mode="login">로그인</button>
        <button type="button" class="modal-tab" data-mode="signup">회원가입</button>
      </div>
      <h3 id="auth-modal-title">로그인</h3>
      <p class="modal-sub" id="auth-modal-sub">SportPick 계정으로 로그인하세요.</p>
      <form id="auth-form">
        <label>이메일
          <input type="email" id="auth-email" required autocomplete="email" />
        </label>
        <label>비밀번호
          <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" />
        </label>
        <p class="auth-error" id="auth-error" hidden></p>
        <p class="auth-info" id="auth-info" hidden></p>
        <button type="submit" class="btn-accent full" id="auth-submit">로그인</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="write-modal" hidden>
    <div class="modal" style="max-width:560px;">
      <button type="button" class="modal-close" id="write-modal-close" aria-label="닫기">&times;</button>
      <h3>글쓰기</h3>
      <p class="modal-sub">SportPick 커뮤니티에 새 글을 남겨보세요.</p>
      <form id="write-form">
        <label>제목
          <input type="text" id="write-title" required maxlength="120" />
        </label>
        <label>내용
          <textarea id="write-content" required maxlength="5000" rows="8"></textarea>
        </label>
        <p class="auth-error" id="write-error" hidden></p>
        <button type="submit" class="btn-accent full">등록</button>
      </form>
    </div>
  </div>

  <main>
    <section class="hero wrap" style="padding:40px 0 20px;">
      <h1>커뮤니티</h1>
      <p>부상 소식, 경기 예상, 응원 이야기까지 — SportPick 이용자들과 자유롭게 나눠보세요.</p>
    </section>

    <section class="section wrap board-wrap">
      <div class="board-toolbar">
        <form id="board-search-form" class="board-search">
          <input type="text" id="board-search-input" placeholder="제목 검색" />
          <button type="submit" class="btn-ghost">검색</button>
        </form>
        <button type="button" class="btn-accent" id="btn-write">글쓰기</button>
      </div>
      <div class="board-table-wrap">
        <table class="board-table">
          <thead>
            <tr>
              <th class="col-no">번호</th>
              <th class="col-title">제목</th>
              <th class="col-author">글쓴이</th>
              <th class="col-date">날짜</th>
              <th class="col-views">조회</th>
            </tr>
          </thead>
          <tbody id="board-list"></tbody>
        </table>
      </div>
      <div class="board-pagination" id="board-pagination"></div>
    </section>
  </main>

  <footer>
    <div class="foot-links">
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <p>© 2026 SportPick. 본 사이트의 정보는 참고용이며 베팅을 권장하지 않습니다.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/supabase-client.js?v=1"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/community.js?v=1"></script>
</body>
</html>
